<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Algebra - Math Learning</title>
    <link rel="stylesheet" href="../../shared/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar glass-panel">
            <a href="../../index.html" class="nav-back" data-i18n="back">← Back to Menu</a>
            <h1 data-i18n="title">Linear Algebra</h1>
            <p data-i18n="desc" style="color: var(--text-muted); font-size: 0.9rem;">
                Visualizing matrix transformations.
            </p>

            <div id="controls-container"></div>

            <div class="control-group">
                <h3 data-i18n="presets">Presets</h3>
                <div class="flex-row" style="flex-wrap: wrap;">
                    <button class="small-btn" onclick="window.setMatrix(1, 0, 0, 1)"
                        data-i18n="p_ident">Identity</button>
                    <button class="small-btn" onclick="window.setMatrix(2, 0, 0, 2)" data-i18n="p_scale">Scale
                        2x</button>
                    <button class="small-btn" onclick="window.setMatrix(0, -1, 1, 0)" data-i18n="p_rot90">Rot
                        90°</button>
                    <button class="small-btn" onclick="window.setMatrix(1, 1, 0, 1)" data-i18n="p_shear">Shear
                        X</button>
                </div>
            </div>

            <div class="control-group">
                <h3 data-i18n="share">Share</h3>
                <button id="btn-share">Copy Link</button>
            </div>
        </div>

        <div class="main-content">
            <canvas id="main-canvas"></canvas>
        </div>
    </div>

    <script type="module" src="./lesson.js"></script>
</body>

</html>
