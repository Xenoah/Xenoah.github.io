<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Interactive Learning</title>
    <link rel="stylesheet" href="shared/style.css">
    <style>
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-lg);
            padding: var(--spacing-lg);
            width: 100%;
        }

        .lesson-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 200px;
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        .lesson-card:hover {
            transform: translateY(-5px);
            background: var(--panel-bg);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
        }

        .lesson-card.disabled {
            opacity: 0.5;
            pointer-events: none;
            border-style: dashed;
        }

        .lesson-card h2 {
            font-size: 1.2rem;
            margin-bottom: var(--spacing-sm);
            color: var(--text-color);
        }

        .lesson-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: auto;
            color: var(--accent-primary);
            opacity: 0.8;
            align-self: flex-end;
            margin-top: auto;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--text-color), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .section-header {
            grid-column: 1 / -1;
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
            color: var(--accent-secondary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar placeholder for globals -->
        <div class="sidebar glass-panel">
            <h1 data-i18n="menu_title">Menu</h1>
            <div id="sidebar-content"></div>
        </div>

        <div style="flex: 1; display:flex; flex-direction:column; overflow-y:auto;">
            <div class="hero">
                <h1 data-i18n="hero_title">Interactive Math Concepts</h1>
                <p data-i18n="hero_subtitle" style="color: var(--text-muted);">Explore mathematical principles through
                    interactive visualizations</p>
            </div>

            <div class="lesson-grid" id="main-grid">
                <!-- Injected via JS -->
            </div>

            <footer style="padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
                Math Learning Project
            </footer>
        </div>
    </div>

    <script type="module">
        import { Globals } from './shared/globals.js';

        // Lesson Data
        const CATEGORIES = [
            { id: 'cat_elem', title_en: 'Origins (Elementary)', title_ja: '起源 (初等数学)' },
            { id: 'cat_hs', title_en: 'Foundations (High School)', title_ja: '基礎 (高校数学)' },
            { id: 'cat_univ', title_en: 'Advanced (University)', title_ja: '発展 (大学教養)' },
            { id: 'cat_unsolved', title_en: 'The Frontier (Unsolved)', title_ja: '未解決問題' }
        ];

        const LESSONS = [
            // Elementary
            { cat: 'cat_elem', id: 'arithmetic', link: 'lessons/arithmetic/index.html', icon: '123', en: { t: 'Arithmetic', d: 'Number line, Blocks, Negatives' }, ja: { t: '算数', d: '数直線、ブロック、負の数' }, working: true },
            { cat: 'cat_elem', id: 'primes', link: 'lessons/primes/index.html', icon: '#', en: { t: 'Prime Numbers', d: 'Sieve of Eratosthenes, Ulam Spiral' }, ja: { t: '素数', d: 'エラトステネスの篩、ウラムの螺旋' }, working: true },

            // High School
            { cat: 'cat_hs', id: 'trig', link: 'lessons/trig_unit_circle/index.html', icon: '○', en: { t: 'Trigonometry', d: 'Unit Circle, Sine, Cosine' }, ja: { t: '三角関数', d: '単位円、サイン、コサイン' }, working: true },
            { cat: 'cat_hs', id: 'factor', link: 'lessons/factorization/index.html', icon: 'x²', en: { t: 'Factorization', d: 'Quadratic polynomials, roots' }, ja: { t: '因数分解', d: '二次多項式、根の配置' }, working: true },
            { cat: 'cat_hs', id: 'calc', link: 'lessons/calculus/index.html', icon: '∫', en: { t: 'Calculus', d: 'Differentiation & Integration' }, ja: { t: '微分積分', d: '微分と積分の可視化' }, working: true },
            { cat: 'cat_hs', id: 'fourier', link: 'lessons/fourier/index.html', icon: '∿', en: { t: 'Fourier Transform', d: 'Frequency decomposition' }, ja: { t: 'フーリエ変換', d: '周波数分解' }, working: true },
            { cat: 'cat_hs', id: 'nd', link: 'lessons/nd_coords/index.html', icon: '⊡', en: { t: 'N-Dimensions', d: 'Projections & Rotations' }, ja: { t: '高次元', d: '射影と回転' }, working: true },

            // University
            { cat: 'cat_univ', id: 'linalg', link: 'lessons/linear_algebra/index.html', icon: '▦', en: { t: 'Linear Algebra', d: 'Matrix Transforms, Eigenvectors' }, ja: { t: '線形代数', d: '行列変換、固有ベクトル' }, working: true },
            { cat: 'cat_univ', id: 'complex', link: 'lessons/complex_analysis/index.html', icon: 'ℂ', en: { t: 'Complex Analysis', d: 'Conformal Mappings' }, ja: { t: '複素解析', d: '等角写像' }, working: true },
            { cat: 'cat_univ', id: 'chaos', link: 'lessons/chaos/index.html', icon: '∞', en: { t: 'Chaos Theory', d: 'Lorenz Attractor, Butterfly Effect' }, ja: { t: 'カオス理論', d: 'ローレンツ・アトラクタ' }, working: true },
            { cat: 'cat_univ', id: 'fractal', link: 'lessons/fractals/index.html', icon: '❄', en: { t: 'Fractals', d: 'Mandelbrot & Julia Sets' }, ja: { t: 'フラクタル', d: 'マンデルブロ集合' }, working: true },
            { cat: 'cat_univ', id: 'prob', link: 'lessons/probability/index.html', icon: '🎲', en: { t: 'Probability', d: 'Monte Carlo & CLT' }, ja: { t: '確率・統計', d: 'モンテカルロ法、中心極限定理' }, working: true },

            // Unsolved
            { cat: 'cat_unsolved', id: 'collatz', link: 'lessons/collatz/index.html', icon: '3n+1', en: { t: 'Collatz Conjecture', d: '3n+1 Problem visualization' }, ja: { t: 'コラッツ予想', d: '3n+1問題の可視化' }, working: true },
            { cat: 'cat_unsolved', id: 'pnp', link: 'lessons/p_vs_np/index.html', icon: 'TSP', en: { t: 'P vs NP', d: 'Traveling Salesperson Problem' }, ja: { t: 'P vs NP問題', d: '巡回セールスマン問題' }, working: true },
        ];

        // Init UI
        const grid = document.getElementById('main-grid');

        CATEGORIES.forEach(cat => {
            const header = document.createElement('h2');
            header.className = 'section-header';
            header.setAttribute('data-i18n', cat.id);
            grid.appendChild(header);

            const catLessons = LESSONS.filter(l => l.cat === cat.id);
            catLessons.forEach(l => {
                const card = document.createElement('a');
                card.className = `lesson-card ${l.working ? '' : 'disabled'}`;
                if (l.working) card.href = l.link;

                card.innerHTML = `
                    <h2 data-i18n="${l.id}_t">${l.en.t}</h2>
                    <p data-i18n="${l.id}_d">${l.en.d}</p>
                    <div class="card-icon">${l.icon}</div>
                `;
                grid.appendChild(card);
            });
        });

        // Dictionary Construction
        const dict = {
            menu_title: { en: 'Menu', ja: 'メニュー' },
            hero_title: { en: 'Interactive Math', ja: 'インタラクティブ数学' },
            hero_subtitle: { en: 'From Arithmetic to Unsolved Problems', ja: '算数から未解決問題まで' },
        };

        // Add categories
        CATEGORIES.forEach(c => {
            dict[c.id] = { en: c.title_en, ja: c.title_ja };
        });

        // Add lessons
        LESSONS.forEach(l => {
            dict[`${l.id}_t`] = { en: l.en.t, ja: l.ja.t };
            dict[`${l.id}_d`] = { en: l.en.d, ja: l.ja.d };
        });

        Globals.subscribe(state => {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    el.textContent = Globals.getText(key, dict[key].en, dict[key].ja);
                }
            });
        });
    </script>
</body>

</html>
