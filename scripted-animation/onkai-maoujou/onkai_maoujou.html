 if(!RAW){const out=[];REC=out;try{STAGES.forEach((st,si)=>{for(let step=0;step<st.bars*16;step++)GEN[st.fn](st,step>>4,step&15,OFF[si]+step*st.sd);});}finally{REC=null;}RAW=out.sort((a,b)=>a.t-b.t);}
 const D=DIFFS[diff],last=[-9,-9,-9,-9],res=[],tA=STAGES[0].sd*32,tB=OFF[19]+STAGES[19].sd*16*7;
 const lastN=[null,null,null,null];
 for(const r of RAW){if(!D.lanes.includes(r.l)||r.t<tA||r.t>tB)continue;const pn=lastN[r.l];if(pn&&r.t-pn.t<0.03){pn.fns.push(r.fn);continue;}if(r.t-last[r.l]<D.gap[r.l])continue;last[r.l]=r.t;const n={t:r.t,lane:r.l,done:false,fns:[r.fn]};lastN[r.l]=n;res.push(n);}
 return res;
}
function hudStage(si){const st=STAGES[si];$('gname').textContent=st.genre;$('bpm').textContent=st.bpm+' BPM';$('sname').textContent=`STAGE ${si+1}  ${st.name}`;$('lv').textContent=LV[si];
 document.documentElement.style.setProperty('--neon','#'+new THREE.Color(TH[si][3]).getHexString());
 [...$('tl').children].forEach((b,i)=>{b.classList.toggle('on',i===si);b.classList.toggle('done',i<si);if(i!==si)b.firstChild.style.width='0';});}
function spawnEnemy(st,hitT,at){
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:enemyTex(st.enemy),transparent:true,color:st.tint||0xffffff}));
 const size=st.enemy==='hood'?1.9:1.6;s.scale.setScalar(size);scene.add(s);
 enemies.push({spr:s,hitT,size,seed:Math.random()*10,dead:false,dieT:0});
 if(!st._met){st._met=true;say(`${st.ename}が あらわれた！`,at);}
}
function killEnemy(e,at){
 e.dead=true;e.dieT=at;burst(e.spr.position,cN1,46,4.5);slash(at);
 const crit=Math.random()<0.25,dmg=crit?9999:(rnd(120,980)|0);
 pops.push({pos:e.spr.position.clone(),txt:crit?'CRITICAL '+dmg:String(dmg),t0:at,crit});
 if(MODE==='auto'){combo++;comboPop=1;}heroMP=Math.max(0.1,heroMP-0.03);
 if(at-lastSay>1.6){const st=STAGES[curStage];const Ls=[`勇者の こうげき！ ${dmg}の ダメージ！`,`${st.ename}を たおした！`,'かいしんの いちげき！',`れんけい ${combo} COMBO！`];say(Ls[(Math.random()*Ls.length)|0],at);}
}
function enemyAttack(e,at){e.dead=true;e.dieT=at;heroHP=Math.max(0,heroHP-0.06);startJack({kind:'bossatk',beats:1,si:curStage},at);checkRevive(at);}
function slash(at){slashes.push({t0:at,flip:swingDir>0});swingT=at;swingDir*=-1;}
function spawnBoss(st,at){
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:enemyTex(st.enemy),transparent:true}));
 const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:st.enemy==='maou'?0xff3300:0x39ff14,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.7}));
 scene.add(gl);scene.add(s);boss={spr:s,glow:gl,size:st.enemy==='maou'?7.5:6,t0:at,hp:1,dead:false,dieT:0,si:st.idx,flash:0};
 $('bossname').textContent=st.ename;bossEl.hidden=false;bossHpEl.style.width='100%';say(`${st.ename}が あらわれた！！`,at);
}
function killBoss(at){if(!boss||boss.dead)return;boss.dead=true;boss.dieT=at;bossEl.hidden=true;
 for(let i=0;i<4;i++)burst(boss.spr.position,i%2?cN1:cN2,120,9);pops.push({pos:boss.spr.position.clone(),txt:'99999',t0:at,crit:true});say(`${STAGES[boss.si].ename}を たおした！`,at);}
function removeAll(){enemies.forEach(e=>scene.remove(e.spr));enemies=[];if(boss){scene.remove(boss.spr);scene.remove(boss.glow);boss=null;}bossEl.hidden=true;}
function checkRevive(at){if(heroHP<=0.001){heroHP=0.6;if(at-lastCheer>5){startJack({kind:'cheer',beats:6,si:curStage,txt:'立って、\n勇者さま！'},at);}}}

function handle(e,at){
 switch(e.type){
 case'stage':{curStage=e.si;curBar=0;const st=STAGES[e.si];setTheme(e.si);setEnv(e.si);hudStage(e.si);heroMP=1;
  if(e.si!==12)heroHP=Math.max(heroHP,e.si===13?1:0.8);
  enemies.forEach(x=>{if(!x.dead){x.dead=true;x.dieT=at;}});
  if(boss&&!st.boss)killBoss(at);
  if(e.si===0){combo=0;STAGES.forEach(s=>s._met=false);}
  if(e.si===0)say('夕暮れの村。勇者は 音界魔王城へ 旅立った。',at);
  else if(e.si===4)say('ついに 魔王城の 門に たどりついた！',at);
  else if(e.si===13)say('歌姫ルミナが 応援に かけつけた！ HPが 全回復した！',at);
  else if(e.si===19)say('魔王城を ぬけると、夜が 明けていた…',at);
  else say(`STAGE ${e.si+1}「${st.name}」に ふみこんだ。`,at);
  break;}
 case'bar':{curBar=e.bar;const st=STAGES[e.si];curSec=st.sec(e.bar);
  if(st.boss&&e.bar===st.bossBar&&!boss)spawnBoss(st,at);
  if(e.si===12&&e.bar===6&&MODE==='auto'){heroHP=0.12;say('勇者は 力尽きかけている…',at);}
  if(e.si===13&&e.bar%2===0)lumiSay={txt:LUMI_LINES[(e.bar/2)%LUMI_LINES.length],t0:at};
  if(e.si===18&&e.bar>=13&&e.bar%2===1)lumiSay={txt:['いっけーー！','あと少し！','信じてるよ！','とどめだー！'][((e.bar-13)/2)%4],t0:at};
  if(e.si===19&&e.bar===3)lumiSay={txt:'おつかれさま、勇者さま！',t0:at};
  break;}
 case'beat':onBeat(e,at);break;
 case'kick':kickP=Math.min(1.2,0.6+e.v*0.5);if(!envOut)flashKey(rnd(3,18),false);break;
 case'snare':snareP=Math.max(snareP,e.v);break;
 case'808':p808=1;break;
 case'wob':wobP=1;break;
 case'note':if(!envOut)flashKey(rnd(5,22),true);break;
 case'impact':kickP=1.4;break;
 case'jack':startJack(e,at);break;
 case'end':finish();break;
 }
}
function onBeat(e,at){
 const st=STAGES[e.si],sec=st.sec(e.bar),bd=60/st.bpm;
 if(st.boss){
  if(!boss||boss.dead||sec!=='drop')return;
  if(MODE==='auto'){slash(at);boss.flash=1;combo++;comboPop=1;
   const crit=e.beat===0,dmg=crit?(rnd(8000,9999)|0):(rnd(1200,4800)|0),bp=boss.spr.position.clone();bp.x+=rnd(-1.2,1.2);bp.y+=rnd(-1,1.5);
   burst(bp,cN1,crit?40:18,5);pops.push({pos:bp,txt:String(dmg),t0:at,crit});}
  if(e.bar%2===1&&e.beat===2){startJack({kind:'bossatk',beats:2,si:e.si},at);heroHP=Math.max(MODE==='auto'?0.12:0,heroHP-0.08);checkRevive(at);if(at-lastSay>1.2)say(`${st.ename}の こうげき！ 勇者は ふんばった！`,at);}
  return;}
 if(!st.enemy||sec==='outro'||sec==='build')return;
 if(sec==='intro'&&e.bar<1)return;
 const interval=sec==='drop'?2:4,gb=e.bar*4+e.beat;if(gb%interval)return;
 const en=enemies.find(x=>!x.dead);
 if(en){if(MODE==='auto'||at-lastHitAt<interval*bd)killEnemy(en,at);else enemyAttack(en,at);}
 if(st.bars*4-gb>interval)spawnEnemy(st,at+interval*bd,at);
}

/* ---------- vision jacks ---------- */
function startJack(e,at){
 const st=STAGES[e.si],j={kind:e.kind,t0:at,dur:Math.max(e.kind==='title'?1.8:0,e.beats*60/st.bpm),txt:e.txt||'',si:e.si};
 if(j.kind==='shatter')j.cr=makeCracks();
 if(j.kind==='textwall')j.str=(j.txt+'   ').repeat(10);
 if(j.kind==='speed')j.lines=Array.from({length:70},()=>({a:Math.random()*TAU,o:Math.random(),w:rnd(1,4)}));
 if(j.kind==='levelup')say(`歌姫の加護！ 勇者の レベルが ${LV[e.si+1]}に あがった！`,at);
 if(j.kind==='eye'&&at-lastSay>0.5)say('視界が ジャックされた！',at);
 if(j.kind==='warning')say(j.txt+'！！',at);
 if(j.kind==='cheer'){lastCheer=at;heroHP=Math.max(heroHP,0.6);}
 if(j.kind==='finale')killBoss(at);
 jacks.push(j);
}
function makeCracks(){const cx=VW*rnd(0.35,0.65),cy=VH*rnd(0.35,0.6),rays=[],n=14;
 for(let i=0;i<n;i++){const a=i/n*TAU+rnd(0,0.3),p=[[cx,cy]];let r=0;for(let k=0;k<6;k++){r+=Math.max(VW,VH)*0.12*rnd(0.6,1.4);const aa=a+rnd(-0.12,0.12);p.push([cx+Math.cos(aa)*r,cy+Math.sin(aa)*r]);}rays.push(p);}
 return {cx,cy,rays};}

 events.length=0;jacks.length=0;slashes.length=0;pops.length=0;removeAll();lumiSay=null;
 musicBus.gain.cancelScheduledValues(ac.currentTime);musicBus.gain.setValueAtTime(1,ac.currentTime);
 SQ.stage=i;SQ.step=0;SQ.nextT=t;done=false;stageStart=[];curStage=i;songT0=t-OFF[i];setTheme(i,true);setEnv(i);hudStage(i);
 chart.forEach(n=>{n.done=n.t<OFF[i]+0.05;n.hitT=n.missT=0;});chartI=0;while(chartI<chart.length&&chart[chartI].done)chartI++;
 if(i===0){combo=0;score=0;jc=[0,0,0,0];nCombo=0;maxCombo=0;heroHP=1;}comboEl.hidden=combo===0||MODE!=='auto';
}
async function begin(){
 if(!ac)initAudio();
 if(ac.state==='suspended')await ac.resume();
 try{await Promise.race([Promise.all([document.fonts.load(`40px "Dela Gothic One"`,'魔王'),document.fonts.load(`20px "DotGothic16"`,'勇者')]),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
 chart=MODE==='rhythm'?buildChart(DIFF):[];MUTE=[0,1,2,3].map(l=>MODE==='rhythm'&&DIFFS[DIFF].lanes.includes(l));
 hudEl.classList.toggle('rhythm',MODE==='rhythm');scoreEl.hidden=MODE!=='rhythm';padEl.classList.toggle('on',MODE==='rhythm');
 startEl.classList.add('off');hudEl.classList.add('on');playing=true;resize();placePad();
 jumpTo(0);
}
$('go').addEventListener('click',begin);
ppBtn.addEventListener('click',()=>{if(!ac||!playing)return;if(paused){ac.resume();paused=false;ppBtn.textContent='II';ppBtn.setAttribute('aria-label','一時停止');}else{ac.suspend();paused=true;ppBtn.textContent='▶';ppBtn.setAttribute('aria-label','再生');}});
const KEYS={KeyD:0,KeyF:1,KeyJ:2,KeyK:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};
addEventListener('keydown',e=>{if(e.code==='Space'&&playing){e.preventDefault();ppBtn.click();return;}if(e.repeat)return;if(e.code in KEYS&&playing&&MODE==='rhythm'){e.preventDefault();press(KEYS[e.code]);}});
padEl.addEventListener('pointerdown',e=>{e.preventDefault();const Lo=seqLayout(),row=Math.floor((e.clientY-Lo.rowsY)/Lo.rowH);if(row>=0&&row<Lo.NL)press(DIFFS[DIFF].lanes[row]);});
function finish(){
 playing=false;MUTE=[false,false,false,false];hudEl.classList.remove('on');padEl.classList.remove('on');
 $('kicker').textContent='GAME CLEAR';$('htitle').hidden=true;$('clearhead').hidden=false;
 const res=$('result');
 if(MODE==='rhythm'){const tot=jc[0]+jc[1]+jc[2]+jc[3]||1,acc=(jc[0]+jc[1]*0.7+jc[2]*0.3)/tot*100,rank=acc>=95?'S':acc>=85?'A':acc>=70?'B':'C';
  $('clearhead').textContent=`RANK ${rank}`;
  res.innerHTML=`<div>PERFECT<b>${jc[0]}</b></div><div>GREAT<b>${jc[1]}</b></div><div>GOOD<b>${jc[2]}</b></div><div>MISS<b>${jc[3]}</b></div>`;res.hidden=false;
  $('subtxt').innerHTML=`SCORE ${score.toLocaleString()} ・ 精度 ${acc.toFixed(1)}% ・ 最大 ${maxCombo} COMBO`;}
 else{$('clearhead').textContent='STAGE CLEAR';res.hidden=true;$('subtxt').innerHTML=`勇者は 魔王ノイズヴァルトを たおした！<br>${combo} COMBO ・ Lv 99`;}
 $('go').textContent='▶ もう一度 冒険する';startEl.classList.remove('off');
 musicBus.gain.setValueAtTime(1,ac.currentTime);curStage=-1;setTheme(0);setEnv(0);removeAll();jacks=[];
}
resize();requestAnimationFrame(frame);
</script>
