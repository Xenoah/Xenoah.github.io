<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AEROLINE — FPV Drone Simulator</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12161f; --line:#232a38;
    --cyan:#4de8d2; --amber:#ffb454; --txt:#dfe7f2; --dim:#7b8698;
    --mono:'SF Mono','Cascadia Code',Consolas,'Roboto Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:var(--mono);touch-action:none;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;display:block}

  /* ===== メニュー ===== */
  #menu{position:fixed;inset:0;background:
    radial-gradient(1200px 600px at 70% -10%,#14202e 0%,transparent 60%),var(--bg);
    display:flex;flex-direction:column;align-items:center;overflow-y:auto;
    padding:24px 16px 40px;z-index:30;touch-action:pan-y}
  .logo{margin:12px 0 2px;font-size:clamp(26px,6vw,44px);letter-spacing:.28em;font-weight:700}
  .logo b{color:var(--cyan);font-weight:700}
  .tagline{color:var(--dim);font-size:11px;letter-spacing:.2em;margin-bottom:22px}
  .menu-grid{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}
  .sect{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px}
  .sect h2{font-size:11px;letter-spacing:.25em;color:var(--amber);margin-bottom:10px;font-weight:600}
  .opts{display:grid;gap:8px}
  .opts.cols3{grid-template-columns:repeat(3,1fr)}
  .opts.cols4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:560px){.opts.cols3{grid-template-columns:1fr}.opts.cols4{grid-template-columns:repeat(2,1fr)}}
  .opt{border:1px solid var(--line);border-radius:8px;background:#0d1119;color:var(--txt);
    padding:10px;text-align:left;cursor:pointer;font-family:var(--mono);
    transition:border-color .15s,background .15s}
  .opt .t{font-size:13px;font-weight:700;letter-spacing:.05em}
  .opt .d{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.5}
  .opt.on{border-color:var(--cyan);background:#0f1d22}
  .opt.on .t{color:var(--cyan)}
  .bar{height:4px;background:#1b2230;border-radius:2px;overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--cyan)}
  .statrow{display:flex;align-items:center;gap:6px;margin-top:6px}
  .statrow span{font-size:9px;color:var(--dim);width:34px}
  #start{margin-top:4px;padding:15px;border:none;border-radius:10px;cursor:pointer;
    background:var(--cyan);color:#04211d;font-family:var(--mono);font-size:15px;font-weight:700;
    letter-spacing:.3em}
  #start:active{transform:scale(.985)}
  .help{color:var(--dim);font-size:10.5px;line-height:1.8;margin-top:14px;text-align:center}

  /* ===== HUD ===== */
  #hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:20}
  .osd{position:absolute;color:var(--cyan);text-shadow:0 0 6px rgba(77,232,210,.5)}
  #osdTL{top:12px;left:14px;font-size:12px;line-height:1.7}
  #osdTC{top:10px;left:50%;transform:translateX(-50%);text-align:center}
  #timer{font-size:clamp(20px,4vw,30px);font-weight:700;letter-spacing:.1em}
  #objective{font-size:11px;color:var(--amber);text-shadow:0 0 6px rgba(255,180,84,.5);margin-top:2px}
  #osdTR{top:12px;right:14px;text-align:right;font-size:12px;line-height:1.7}
  #msg{position:absolute;top:34%;left:50%;transform:translateX(-50%);
    font-size:clamp(18px,5vw,34px);font-weight:700;letter-spacing:.25em;color:var(--amber);
    text-shadow:0 0 12px rgba(255,180,84,.6);opacity:0;transition:opacity .3s;text-align:center;
    white-space:nowrap}
  #cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:56px;height:56px;opacity:.85}
  #ringPtr{position:absolute;width:0;height:0;border:9px solid transparent;
    border-bottom:16px solid var(--amber);filter:drop-shadow(0 0 4px rgba(255,180,84,.7));
    display:none;left:0;top:0}
  .corner{position:absolute;width:26px;height:26px;border:2px solid rgba(77,232,210,.35)}
  .corner.tl{top:8px;left:8px;border-right:none;border-bottom:none}
  .corner.tr{top:8px;right:8px;border-left:none;border-bottom:none}
  .corner.bl{bottom:8px;left:8px;border-right:none;border-top:none}
  .corner.br{bottom:8px;right:8px;border-left:none;border-top:none}
  #pauseBtn,#camBtn{position:absolute;top:56px;pointer-events:auto;
    border:1px solid rgba(77,232,210,.4);background:rgba(11,14,19,.55);color:var(--cyan);
    font-family:var(--mono);font-size:11px;letter-spacing:.15em;padding:7px 12px;border-radius:6px;cursor:pointer}
  #pauseBtn{right:14px}
  #camBtn{left:14px}

  /* 仮想ジョイスティック */
  .stick{position:absolute;bottom:26px;width:128px;height:128px;border-radius:50%;
    border:1px solid rgba(77,232,210,.3);background:rgba(18,22,31,.35);
    pointer-events:auto;display:none}
  #stickL{left:22px} #stickR{right:22px}
  .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;
    background:rgba(77,232,210,.25);border:1px solid rgba(77,232,210,.6);
    transform:translate(-50%,-50%)}
  .stick .lbl{position:absolute;top:-16px;width:100%;text-align:center;
    font-size:9px;color:var(--dim);letter-spacing:.15em}

  /* ポーズ / リザルト */
  .overlay{position:fixed;inset:0;background:rgba(7,9,13,.82);z-index:40;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
  .overlay h2{letter-spacing:.3em;font-size:20px;color:var(--cyan)}
  .overlay .big{font-size:clamp(28px,7vw,48px);font-weight:700;color:var(--amber);letter-spacing:.08em}
  .overlay .sub{color:var(--dim);font-size:12px;letter-spacing:.1em;text-align:center;line-height:1.9}
  .obtn{min-width:220px;padding:13px;border-radius:8px;cursor:pointer;font-family:var(--mono);
    font-size:13px;letter-spacing:.2em;font-weight:700;border:1px solid var(--line);
    background:var(--panel);color:var(--txt)}
  .obtn.primary{background:var(--cyan);color:#04211d;border:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="logo">AERO<b>LINE</b></div>
  <div class="tagline">FPV DRONE SIMULATOR</div>
  <div class="menu-grid">
    <div class="sect"><h2>MODE / モード</h2><div class="opts cols3" id="modeOpts"></div></div>
    <div class="sect"><h2>DRONE / 機体</h2><div class="opts cols3" id="droneOpts"></div></div>
    <div class="sect"><h2>COURSE / コース</h2><div class="opts cols3" id="courseOpts"></div></div>
    <div class="sect"><h2>GRAPHICS / 画質</h2><div class="opts cols4" id="qualOpts"></div></div>
    <button id="start">FLIGHT START</button>
    <div class="help">
      PC: W/S 上昇・下降｜A/D 旋回｜矢印キー 前後・左右移動｜C カメラ切替｜Esc ポーズ<br>
      スマホ: 左スティック 上昇・旋回｜右スティック 前後・左右移動
    </div>
  </div>
</div>

<div id="hud">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="osd" id="osdTL">SPD <span id="spd">0.0</span> m/s<br>ALT <span id="alt">0.0</span> m</div>
  <div class="osd" id="osdTC"><div id="timer">0:00.0</div><div id="objective"></div></div>
  <div class="osd" id="osdTR"><span id="ringInfo"></span><br><span id="bestInfo"></span></div>
  <svg id="cross" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="14" fill="none" stroke="#4de8d2" stroke-width="1.4" opacity=".9"/>
    <line x1="28" y1="6"  x2="28" y2="16" stroke="#4de8d2" stroke-width="1.4"/>
    <line x1="28" y1="40" x2="28" y2="50" stroke="#4de8d2" stroke-width="1.4"/>
    <line x1="6"  y1="28" x2="16" y2="28" stroke="#4de8d2" stroke-width="1.4"/>
    <line x1="40" y1="28" x2="50" y2="28" stroke="#4de8d2" stroke-width="1.4"/>
  </svg>
  <div id="ringPtr"></div>
  <div id="msg"></div>
  <button id="camBtn">CAM: 追跡</button>
  <button id="pauseBtn">❚❚ PAUSE</button>
  <div class="stick" id="stickL"><div class="lbl">上昇 / 旋回</div><div class="knob"></div></div>
  <div class="stick" id="stickR"><div class="lbl">移動</div><div class="knob"></div></div>
</div>

<div class="overlay" id="pauseOv">
  <h2>PAUSED</h2>
  <button class="obtn primary" id="resumeBtn">再開する</button>
  <button class="obtn" id="restartBtn">リスタート</button>
  <button class="obtn" id="quitBtn">メニューへ戻る</button>
</div>

<div class="overlay" id="resultOv">
  <h2 id="resultTitle">FINISH</h2>
  <div class="big" id="resultMain"></div>
  <div class="sub" id="resultSub"></div>
  <button class="obtn primary" id="againBtn">もう一度</button>
  <button class="obtn" id="menuBtn">メニューへ戻る</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   AEROLINE — FPV Drone Simulator
   モード: フリーフライト / リングレース / タイムアタック
   画質: 低 / 中 / 高 / ウルトラRT(リアルタイム鏡面反射+ソフトシャドウ)
============================================================ */

// ---------------- データ ----------------
const MODES = [
  {id:'free', name:'フリーフライト', desc:'目的なし。自由に飛んで操作に慣れる。'},
  {id:'race', name:'リングレース',   desc:'全リングを順番に通過してタイムを競う。'},
  {id:'ta',   name:'タイムアタック', desc:'60秒間にできるだけ多くのリングを通過。'},
];
const DRONES = [
  {id:'swift', name:'SWIFT-R', desc:'レース特化。最速だが神経質。',
   color:0xff5d73, accel:36, maxSpd:32, lift:17, yaw:2.7, drag:1.1, size:1.0,
   stats:{spd:1.0, agi:0.95, stb:0.35}},
  {id:'atlas', name:'ATLAS-M', desc:'バランス型。素直な万能機。',
   color:0x4de8d2, accel:27, maxSpd:24, lift:13, yaw:2.0, drag:1.6, size:1.1,
   stats:{spd:0.7, agi:0.7, stb:0.7}},
  {id:'mule',  name:'MULE-C', desc:'重量級カーゴ。遅いが超安定。',
   color:0xffb454, accel:18, maxSpd:16, lift:10, yaw:1.4, drag:2.4, size:1.35,
   stats:{spd:0.45, agi:0.4, stb:1.0}},
];
const COURSES = [
  {id:'city',   name:'メトロシティ',    desc:'高層ビル群を縫って飛ぶ都市コース。'},
  {id:'canyon', name:'レッドキャニオン', desc:'岩柱が乱立する渓谷。低空高速コース。'},
  {id:'neon',   name:'ネオンナイト',    desc:'夜の発光都市。上昇スパイラルの難所。'},
];
const QUALS = [
  {id:'low',   name:'低',   desc:'軽量。古い端末向け。',        px:0.55, shadow:false, soft:false, objects:0.45, mirror:false},
  {id:'med',   name:'中',   desc:'標準バランス。',              px:1.0,  shadow:false, soft:false, objects:0.75, mirror:false},
  {id:'high',  name:'高',   desc:'影 + 高解像度。',             px:1.5,  shadow:true,  soft:false, objects:1.0,  mirror:false},
  {id:'ultra', name:'ウルトラ RT', desc:'リアルタイム鏡面反射 + ソフトシャドウ。', px:2.0, shadow:true, soft:true, objects:1.0, mirror:true},
];

const sel = {mode:'race', drone:'atlas', course:'city', qual:'med'};
const bestTimes = {};    // メモリ内保持: key = course|drone
const bestScores = {};

// ---------------- メニューUI ----------------
function statBar(label,v){
  return `<div class="statrow"><span>${label}</span><div class="bar"><i style="width:${Math.round(v*100)}%"></i></div></div>`;
}
function buildOpts(elId, list, key, withStats){
  const el = document.getElementById(elId);
  list.forEach(item=>{
    const b = document.createElement('button');
    b.className = 'opt' + (sel[key]===item.id ? ' on':'');
    let html = `<div class="t">${item.name}</div><div class="d">${item.desc}</div>`;
    if(withStats && item.stats)
      html += statBar('速度',item.stats.spd)+statBar('機動',item.stats.agi)+statBar('安定',item.stats.stb);
    b.innerHTML = html;
    b.onclick = ()=>{
      sel[key]=item.id;
      [...el.children].forEach(c=>c.classList.remove('on'));
      b.classList.add('on');
    };
    el.appendChild(b);
  });
}
buildOpts('modeOpts',MODES,'mode');
buildOpts('droneOpts',DRONES,'drone',true);
buildOpts('courseOpts',COURSES,'course');
buildOpts('qualOpts',QUALS,'qual');

// ---------------- 入力 ----------------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const input={throttle:0,yaw:0,pitch:0,roll:0};
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Escape'&&state.phase==='play') pauseGame();
  if(e.code==='KeyC'&&state.phase==='play') toggleCam();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});

class Stick{
  constructor(el){
    this.el=el; this.knob=el.querySelector('.knob');
    this.x=0; this.y=0; this.pid=null;
    el.addEventListener('pointerdown',e=>{this.pid=e.pointerId; el.setPointerCapture(e.pointerId); this.move(e); e.preventDefault();});
    el.addEventListener('pointermove',e=>{if(e.pointerId===this.pid) this.move(e);});
    const end=e=>{if(e.pointerId===this.pid){this.pid=null;this.x=0;this.y=0;this.draw();}};
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
  }
  move(e){
    const rc=this.el.getBoundingClientRect();
    const cx=rc.left+rc.width/2, cy=rc.top+rc.height/2, R=rc.width/2-10;
    let dx=(e.clientX-cx)/R, dy=(e.clientY-cy)/R;
    const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;}
    this.x=dx; this.y=-dy; this.draw();
  }
  draw(){
    this.knob.style.transform=`translate(calc(-50% + ${this.x*38}px), calc(-50% + ${-this.y*38}px))`;
  }
}
const stickL=new Stick(document.getElementById('stickL'));
const stickR=new Stick(document.getElementById('stickR'));
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);

function updateInput(){
  let t=0,y=0,p=0,r=0;
  if(keys['KeyW'])t+=1; if(keys['KeyS'])t-=1;
  if(keys['KeyA'])y+=1; if(keys['KeyD'])y-=1;
  if(keys['ArrowUp'])p+=1; if(keys['ArrowDown'])p-=1;
  if(keys['ArrowRight'])r+=1; if(keys['ArrowLeft'])r-=1;
  input.throttle=clamp(t+stickL.y,-1,1);
  input.yaw     =clamp(y-stickL.x,-1,1);
  input.pitch   =clamp(p+stickR.y,-1,1);
  input.roll    =clamp(r+stickR.x,-1,1);
}

// ---------------- Three.js 基盤 ----------------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.outputEncoding=THREE.sRGBEncoding;
let scene=null, camera=null, sun=null;
let staticGroup=null, mirrorGroup=null, mirrorDroneNode=null;
let colliders=[];       // {min,max}
let rings=[];           // {mesh,pos,normal,radius,mat,glowMat}
let drone=null;         // {group,rotors,spec,pos,vel,heading,visPitch,visRoll}
let camMode=0;          // 0=追跡 1=FPV
const state={phase:'menu',time:0,ring:0,score:0,taLeft:60,finished:false,msgT:0};
const $=id=>document.getElementById(id);

addEventListener('resize',()=>{
  if(!camera)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  applySize();
});
function applySize(){
  const q=QUALS.find(q=>q.id===sel.qual);
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,q.px));
  renderer.setSize(innerWidth,innerHeight);
}

// ---------------- 機体モデル ----------------
function buildDroneMesh(spec){
  const g=new THREE.Group();
  const s=spec.size;
  const bodyMat=new THREE.MeshStandardMaterial({color:spec.color,metalness:.65,roughness:.3});
  const darkMat=new THREE.MeshStandardMaterial({color:0x1a1f28,metalness:.4,roughness:.6});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.9*s,.28*s,1.3*s),bodyMat);
  body.castShadow=true; g.add(body);
  const canopy=new THREE.Mesh(new THREE.BoxGeometry(.5*s,.22*s,.6*s),
    new THREE.MeshStandardMaterial({color:0x0e1116,metalness:.9,roughness:.15}));
  canopy.position.set(0,.24*s,-.15*s); canopy.castShadow=true; g.add(canopy);
  const rotors=[];
  [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([ax,az])=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(.12*s,.08*s,1.05*s),darkMat);
    arm.position.set(ax*s*.42,.05,az*s*.42);
    arm.rotation.y=Math.atan2(ax,az);
    arm.castShadow=true; g.add(arm);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.09*s,.09*s,.14*s,8),darkMat);
    hub.position.set(ax*s*.78,.12*s,az*s*.78); g.add(hub);
    const blade=new THREE.Mesh(new THREE.BoxGeometry(1.1*s,.03,.11*s),
      new THREE.MeshStandardMaterial({color:0x2c3442,metalness:.3,roughness:.5,transparent:true,opacity:.85}));
    blade.position.set(ax*s*.78,.2*s,az*s*.78);
    g.add(blade); rotors.push(blade);
  });
  const led=new THREE.Mesh(new THREE.BoxGeometry(.22*s,.06,.06),
    new THREE.MeshStandardMaterial({color:spec.color,emissive:spec.color,emissiveIntensity:2.2}));
  led.position.set(0,.06,-.68*s); g.add(led);
  return {group:g,rotors};
}

// ---------------- コース構築ヘルパ ----------------
function seededRand(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function addBoxCollider(x,y,z,w,h,d){
  colliders.push({min:new THREE.Vector3(x-w/2,y-h/2,z-d/2),max:new THREE.Vector3(x+w/2,y+h/2,z+d/2)});
}
function mkSun(color,intensity,x,y,z,q){
  const l=new THREE.DirectionalLight(color,intensity);
  l.position.set(x,y,z);
  if(q.shadow){
    l.castShadow=true;
    l.shadow.mapSize.set(q.soft?2048:1024,q.soft?2048:1024);
    const S=160;
    l.shadow.camera.left=-S; l.shadow.camera.right=S;
    l.shadow.camera.top=S;   l.shadow.camera.bottom=-S;
    l.shadow.camera.near=10; l.shadow.camera.far=500;
    l.shadow.bias=-0.0005;
  }
  scene.add(l);
  return l;
}
function mkGround(color,q,opts={}){
  const mat=new THREE.MeshStandardMaterial({
    color, roughness:opts.rough??.9, metalness:opts.metal??.05,
    transparent:!!q.mirror, opacity:q.mirror?(opts.mirrorOpacity??.62):1
  });
  const g=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),mat);
  g.rotation.x=-Math.PI/2; g.receiveShadow=true;
  scene.add(g);
  // グリッド線(視覚的な速度感)
  const grid=new THREE.GridHelper(1000,80,opts.gridColor??0xffffff,opts.gridColor??0xffffff);
  grid.material.transparent=true; grid.material.opacity=opts.gridOpacity??.07;
  grid.position.y=.02;
  scene.add(grid);
}

// ---------------- リング ----------------
function addRing(x,y,z,lookAt,radius,baseColor){
  const geo=new THREE.TorusGeometry(radius,.35,10,36);
  const mat=new THREE.MeshStandardMaterial({color:baseColor,emissive:baseColor,emissiveIntensity:.25,metalness:.5,roughness:.4});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(x,y,z);
  mesh.lookAt(lookAt.x,lookAt.y,lookAt.z);
  mesh.castShadow=true;
  staticGroup.add(mesh);
  const normal=new THREE.Vector3(0,0,1).applyQuaternion(mesh.quaternion);
  rings.push({mesh,pos:new THREE.Vector3(x,y,z),normal,radius,mat,passed:false,prevSide:0});
}
function buildRingPath(points,radius,color){
  for(let i=0;i<points.length;i++){
    const p=points[i];
    const next=points[(i+1)%points.length];
    addRing(p[0],p[1],p[2],new THREE.Vector3(next[0],next[1],next[2]),radius,color);
  }
}

// ---------------- コース ----------------
function buildCourse(id,q){
  colliders=[]; rings=[];
  staticGroup=new THREE.Group();
  scene.add(staticGroup);
  const rnd=seededRand(id==='city'?42:id==='canyon'?7:99);
  const density=q.objects;

  if(id==='city'){
    scene.background=new THREE.Color(0x9fc4e0);
    scene.fog=new THREE.Fog(0x9fc4e0,90,480);
    sun=mkSun(0xffffff,1.05,120,180,80,q);
    scene.add(new THREE.HemisphereLight(0xcfe6ff,0x50565e,.75));
    mkGround(0x3a4250,q,{gridOpacity:.09});
    const mats=[0x5b6a7e,0x77848f,0x46505f,0x8d99a6].map(c=>
      new THREE.MeshStandardMaterial({color:c,metalness:.25,roughness:.75}));
    const N=Math.floor(130*density);
    for(let i=0;i<N;i++){
      const gx=-220+rnd()*440, gz=-220+rnd()*440;
      if(Math.hypot(gx,gz)<30) continue;
      const w=10+rnd()*16, d=10+rnd()*16, h=14+rnd()*70;
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats[i%4]);
      m.position.set(gx,h/2,gz);
      m.castShadow=m.receiveShadow=true;
      staticGroup.add(m);
      addBoxCollider(gx,h/2,gz,w,h,d);
    }
    buildRingPath([
      [0,14,-60],[55,20,-95],[105,28,-45],[120,34,25],[70,26,85],
      [0,20,115],[-70,28,85],[-115,36,20],[-100,24,-55],[-45,16,-85]
    ],7,0x4de8d2);
  }
  else if(id==='canyon'){
    scene.background=new THREE.Color(0xf2c9a0);
    scene.fog=new THREE.Fog(0xf2c9a0,80,420);
    sun=mkSun(0xffe6c4,1.2,-100,150,60,q);
    scene.add(new THREE.HemisphereLight(0xffe0bb,0x7a4a30,.7));
    mkGround(0xb0713f,q,{gridColor:0x000000,gridOpacity:.06});
    const rockA=new THREE.MeshStandardMaterial({color:0xa35a33,roughness:.95});
    const rockB=new THREE.MeshStandardMaterial({color:0x8a4527,roughness:.95});
    const N=Math.floor(95*density);
    for(let i=0;i<N;i++){
      const gx=-240+rnd()*480, gz=-240+rnd()*480;
      if(Math.hypot(gx,gz)<32) continue;
      const r=5+rnd()*10, h=20+rnd()*55;
      const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.6,r,h,7),i%2?rockA:rockB);
      m.position.set(gx,h/2,gz);
      m.castShadow=m.receiveShadow=true;
      staticGroup.add(m);
      addBoxCollider(gx,h/2,gz,r*1.7,h,r*1.7);
    }
    buildRingPath([
      [0,8,-70],[70,10,-110],[130,14,-50],[150,10,40],[90,8,110],
      [0,12,140],[-90,10,105],[-145,14,30],[-120,9,-60],[-55,8,-100]
    ],8,0xffb454);
  }
  else{ // neon
    scene.background=new THREE.Color(0x060812);
    scene.fog=new THREE.Fog(0x060812,70,380);
    sun=mkSun(0x8090ff,.35,-80,160,-60,q);
    scene.add(new THREE.HemisphereLight(0x30406a,0x05060a,.55));
    scene.add(new THREE.AmbientLight(0x101528,1));
    mkGround(0x0a0d16,q,{rough:.4,metal:.3,gridColor:0x4de8d2,gridOpacity:.14,mirrorOpacity:.5});
    const neonColors=[0x4de8d2,0xff5d73,0xffb454,0x8f7bff];
    const N=Math.floor(110*density);
    for(let i=0;i<N;i++){
      const gx=-220+rnd()*440, gz=-220+rnd()*440;
      if(Math.hypot(gx,gz)<30) continue;
      const w=8+rnd()*14, d=8+rnd()*14, h=16+rnd()*80;
      const c=neonColors[i%4];
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({color:0x0d1220,metalness:.5,roughness:.5,
          emissive:c,emissiveIntensity:.14}));
      m.position.set(gx,h/2,gz);
      m.castShadow=m.receiveShadow=true;
      staticGroup.add(m);
      addBoxCollider(gx,h/2,gz,w,h,d);
      // 縁のネオンフレーム
      const edge=new THREE.Mesh(new THREE.BoxGeometry(w+.4,1.1,d+.4),
        new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.6}));
      edge.position.set(gx,h,gz);
      staticGroup.add(edge);
    }
    // 上昇スパイラル
    const pts=[];
    for(let i=0;i<12;i++){
      const a=i/12*Math.PI*2;
      const R=100-i*2;
      pts.push([Math.cos(a)*R,10+i*7,Math.sin(a)*R]);
    }
    buildRingPath(pts,7,0xff5d73);
  }
}

// ---------------- ウルトラRT: 鏡面反射(ミラーレンダリング) ----------------
function buildMirror(){
  // 静的シーン + 機体を y=-1 スケールの親でクローンし、
  // 半透明の地面越しに映すことでリアルタイム平面反射を実現
  mirrorGroup=new THREE.Group();
  mirrorGroup.scale.y=-1;
  const staticClone=staticGroup.clone(true);
  staticClone.traverse(o=>{o.castShadow=false;o.receiveShadow=false;});
  mirrorGroup.add(staticClone);
  mirrorDroneNode=drone.group.clone(true);
  mirrorDroneNode.traverse(o=>{o.castShadow=false;});
  mirrorGroup.add(mirrorDroneNode);
  // 反転面の裏面カリング対策
  mirrorGroup.traverse(o=>{
    if(o.isMesh&&o.material){ o.material=o.material.clone(); o.material.side=THREE.BackSide; }
  });
  scene.add(mirrorGroup);
}
function syncMirror(){
  if(!mirrorDroneNode)return;
  mirrorDroneNode.position.copy(drone.group.position);
  mirrorDroneNode.quaternion.copy(drone.group.quaternion);
  mirrorDroneNode.children.forEach((c,i)=>{
    const src=drone.group.children[i];
    if(src){c.rotation.copy(src.rotation);c.position.copy(src.position);}
  });
}

// ---------------- ゲーム開始 ----------------
function startGame(){
  const q=QUALS.find(x=>x.id===sel.qual);
  const dspec=DRONES.find(x=>x.id===sel.drone);

  // シーン初期化
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,1500);
  renderer.shadowMap.enabled=q.shadow;
  renderer.shadowMap.type=q.soft?THREE.PCFSoftShadowMap:THREE.PCFShadowMap;
  applySize();

  buildCourse(sel.course,q);

  // 機体
  const dm=buildDroneMesh(dspec);
  drone={
    group:dm.group, rotors:dm.rotors, spec:dspec,
    pos:new THREE.Vector3(0,6,0), vel:new THREE.Vector3(),
    heading:0, visPitch:0, visRoll:0, rotorSpin:0
  };
  // 最初のリングの方を向く
  if(rings.length) drone.heading=Math.atan2(
    rings[0].pos.x-drone.pos.x, rings[0].pos.z-drone.pos.z)+Math.PI;
  scene.add(drone.group);

  mirrorGroup=null; mirrorDroneNode=null;
  if(q.mirror) buildMirror();

  // 状態リセット
  state.phase='play';
  state.time=0; state.ring=0; state.score=0; state.taLeft=60; state.finished=false;
  rings.forEach(r=>{r.passed=false;r.prevSide=0;});
  highlightRing();

  // UI
  $('menu').style.display='none';
  $('resultOv').style.display='none';
  $('pauseOv').style.display='none';
  $('hud').style.display='block';
  const showSticks=isTouch?'block':'none';
  $('stickL').style.display=showSticks;
  $('stickR').style.display=showSticks;
  updateHudStatic();
  showMsg(sel.mode==='free'?'FREE FLIGHT':'READY — GO!',1.6);
  lastT=performance.now();
}

function updateHudStatic(){
  const key=sel.course+'|'+sel.drone;
  if(sel.mode==='race'){
    $('objective').textContent='リングを順番に通過せよ';
    $('bestInfo').textContent=bestTimes[key]?('BEST '+fmtTime(bestTimes[key])):'BEST --:--.-';
  }else if(sel.mode==='ta'){
    $('objective').textContent='60秒間スコアアタック';
    $('bestInfo').textContent=bestScores[key]?('BEST '+bestScores[key]+' RINGS'):'BEST --';
  }else{
    $('objective').textContent='';
    $('bestInfo').textContent='';
    $('ringInfo').textContent='';
  }
}
function highlightRing(){
  rings.forEach((r,i)=>{
    if(sel.mode==='free'){ r.mat.emissiveIntensity=.3; return; }
    r.mat.emissiveIntensity=(i===state.ring)?1.6:.15;
  });
}
function showMsg(txt,dur){
  const m=$('msg');
  m.textContent=txt; m.style.opacity=1;
  state.msgT=dur;
}
function fmtTime(t){
  const m=Math.floor(t/60), s=t-m*60;
  return m+':'+(s<10?'0':'')+s.toFixed(1);
}

// ---------------- 物理 ----------------
const _v=new THREE.Vector3();
function stepPhysics(dt){
  const sp=drone.spec;
  // 旋回
  drone.heading+=input.yaw*sp.yaw*dt;
  const sinH=Math.sin(drone.heading), cosH=Math.cos(drone.heading);
  // 機体基準の前方/右方(前方 = -Z を heading 回転)
  const fwd=_v.set(-sinH,0,-cosH);
  // 加速
  drone.vel.x+=(fwd.x*input.pitch + cosH*input.roll)*sp.accel*dt;
  drone.vel.z+=(fwd.z*input.pitch - sinH*input.roll)*sp.accel*dt;
  drone.vel.y+=input.throttle*sp.lift*dt;
  // 抗力
  const drag=Math.exp(-sp.drag*dt);
  drone.vel.multiplyScalar(drag);
  // 速度制限
  const spd=drone.vel.length();
  if(spd>sp.maxSpd) drone.vel.multiplyScalar(sp.maxSpd/spd);
  // 位置更新
  drone.pos.addScaledVector(drone.vel,dt);
  // 地面
  if(drone.pos.y<.6){drone.pos.y=.6; if(drone.vel.y<0)drone.vel.y*=-.25;}
  if(drone.pos.y>220){drone.pos.y=220; drone.vel.y=Math.min(drone.vel.y,0);}
  // ワールド境界
  const B=280;
  if(Math.abs(drone.pos.x)>B){drone.pos.x=clamp(drone.pos.x,-B,B); drone.vel.x*=-.3;}
  if(Math.abs(drone.pos.z)>B){drone.pos.z=clamp(drone.pos.z,-B,B); drone.vel.z*=-.3;}
  // 建物衝突(AABB押し出し)
  const R=.8*drone.spec.size;
  for(const c of colliders){
    if(drone.pos.x>c.min.x-R&&drone.pos.x<c.max.x+R&&
       drone.pos.y>c.min.y-R&&drone.pos.y<c.max.y+R&&
       drone.pos.z>c.min.z-R&&drone.pos.z<c.max.z+R){
      // 最小押し出し軸を探す
      const dx1=(c.max.x+R)-drone.pos.x, dx2=drone.pos.x-(c.min.x-R);
      const dy1=(c.max.y+R)-drone.pos.y, dy2=drone.pos.y-(c.min.y-R);
      const dz1=(c.max.z+R)-drone.pos.z, dz2=drone.pos.z-(c.min.z-R);
      const px=Math.min(dx1,dx2), py=Math.min(dy1,dy2), pz=Math.min(dz1,dz2);
      if(px<=py&&px<=pz){ drone.pos.x+=(dx1<dx2? dx1:-dx2); drone.vel.x*=-.35; }
      else if(py<=px&&py<=pz){ drone.pos.y+=(dy1<dy2? dy1:-dy2); drone.vel.y*=-.35; }
      else { drone.pos.z+=(dz1<dz2? dz1:-dz2); drone.vel.z*=-.35; }
      drone.vel.multiplyScalar(.8);
    }
  }
  // 見た目の傾き
  drone.visPitch=lerp(drone.visPitch,-input.pitch*.42,1-Math.exp(-8*dt));
  drone.visRoll =lerp(drone.visRoll, -input.roll *.42,1-Math.exp(-8*dt));
  drone.group.position.copy(drone.pos);
  drone.group.rotation.set(0,0,0);
  drone.group.rotateY(drone.heading);
  drone.group.rotateX(drone.visPitch);
  drone.group.rotateZ(drone.visRoll);
  // ローター回転
  drone.rotorSpin+=(14+Math.abs(input.throttle)*30+spd*.6)*dt;
  drone.rotors.forEach((r,i)=>{r.rotation.y=drone.rotorSpin*(i%2?1:-1);});
}

// ---------------- リング判定 ----------------
function checkRings(){
  if(sel.mode==='free'||state.finished||!rings.length)return;
  const r=rings[state.ring];
  const d=_v.copy(drone.pos).sub(r.pos);
  const side=d.dot(r.normal);
  const radial=d.clone().addScaledVector(r.normal,-side).length();
  if(r.prevSide!==0 && Math.sign(side)!==Math.sign(r.prevSide) &&
     Math.abs(side)<4 && radial<r.radius*.95){
    // 通過!
    state.ring++;
    if(sel.mode==='race'){
      if(state.ring>=rings.length){finishRace();}
      else showMsg('RING '+state.ring+' / '+rings.length,.8);
    }else{ // タイムアタック: ループ
      state.score++;
      if(state.ring>=rings.length)state.ring=0;
      showMsg('+1  ('+state.score+')',.6);
    }
    highlightRing();
  }
  r.prevSide=side;
}
function finishRace(){
  state.finished=true;
  const key=sel.course+'|'+sel.drone;
  const t=state.time;
  let sub='コース: '+COURSES.find(c=>c.id===sel.course).name+
    ' ／ 機体: '+DRONES.find(d=>d.id===sel.drone).name;
  if(!bestTimes[key]||t<bestTimes[key]){
    bestTimes[key]=t;
    sub+='<br><span style="color:#4de8d2">★ NEW RECORD!</span>';
  }else{
    sub+='<br>BEST '+fmtTime(bestTimes[key]);
  }
  showResult('FINISH',fmtTime(t),sub);
}
function finishTA(){
  state.finished=true;
  const key=sel.course+'|'+sel.drone;
  let sub='60秒間の通過リング数';
  if(!bestScores[key]||state.score>bestScores[key]){
    bestScores[key]=state.score;
    sub+='<br><span style="color:#4de8d2">★ NEW RECORD!</span>';
  }else{
    sub+='<br>BEST '+bestScores[key]+' RINGS';
  }
  showResult('TIME UP',state.score+' RINGS',sub);
}
function showResult(title,main,sub){
  state.phase='result';
  $('resultTitle').textContent=title;
  $('resultMain').textContent=main;
  $('resultSub').innerHTML=sub;
  $('resultOv').style.display='flex';
}

// ---------------- カメラ ----------------
const camPos=new THREE.Vector3(0,8,10);
function toggleCam(){
  camMode=(camMode+1)%2;
  $('camBtn').textContent='CAM: '+(camMode===0?'追跡':'FPV');
}
$('camBtn').onclick=()=>toggleCam();
function stepCamera(dt){
  if(camMode===0){
    const back=6.5, up=2.6;
    const tx=drone.pos.x+Math.sin(drone.heading)*back;
    const tz=drone.pos.z+Math.cos(drone.heading)*back;
    const ty=drone.pos.y+up;
    const k=1-Math.exp(-6*dt);
    camPos.x=lerp(camPos.x,tx,k);
    camPos.y=lerp(camPos.y,ty,k);
    camPos.z=lerp(camPos.z,tz,k);
    camera.position.copy(camPos);
    camera.lookAt(drone.pos.x,drone.pos.y+.5,drone.pos.z);
    drone.group.visible=true;
  }else{
    camera.position.set(drone.pos.x,drone.pos.y+.25,drone.pos.z);
    camera.rotation.set(0,0,0);
    camera.rotateY(drone.heading);
    camera.rotateX(drone.visPitch*.55+.06);
    camera.rotateZ(drone.visRoll*.7);
    drone.group.visible=false;
  }
  if(mirrorDroneNode)mirrorDroneNode.visible=drone.group.visible;
}

// ---------------- HUD更新 ----------------
function stepHud(dt){
  $('spd').textContent=drone.vel.length().toFixed(1);
  $('alt').textContent=drone.pos.y.toFixed(1);
  if(sel.mode==='race'){
    $('timer').textContent=fmtTime(state.time);
    $('ringInfo').textContent='RING '+Math.min(state.ring+1,rings.length)+' / '+rings.length;
  }else if(sel.mode==='ta'){
    $('timer').textContent=Math.max(0,state.taLeft).toFixed(1);
    $('ringInfo').textContent='SCORE '+state.score;
  }else{
    $('timer').textContent=fmtTime(state.time);
  }
  if(state.msgT>0){
    state.msgT-=dt;
    if(state.msgT<=0)$('msg').style.opacity=0;
  }
  // 次リングの画面内/端マーカー
  const ptr=$('ringPtr');
  if(sel.mode!=='free'&&rings.length&&!state.finished){
    const r=rings[state.ring];
    const p=r.pos.clone().project(camera);
    const behind=p.z>1;
    let sx=(p.x*.5+.5)*innerWidth, sy=(-p.y*.5+.5)*innerHeight;
    if(behind){sx=innerWidth-sx; sy=innerHeight;}
    const onScreen=!behind&&sx>40&&sx<innerWidth-40&&sy>40&&sy<innerHeight-40;
    if(onScreen){ptr.style.display='none';}
    else{
      ptr.style.display='block';
      const cx=innerWidth/2, cy=innerHeight/2;
      let dx=sx-cx, dy=sy-cy;
      const m=Math.hypot(dx,dy)||1;
      const R=Math.min(cx,cy)-46;
      dx=dx/m*R; dy=dy/m*R;
      const ang=Math.atan2(dy,dx)+Math.PI/2;
      ptr.style.transform=`translate(${cx+dx-9}px,${cy+dy-12}px) rotate(${ang}rad)`;
    }
  }else ptr.style.display='none';
}

// ---------------- ポーズ/画面遷移 ----------------
function pauseGame(){
  if(state.phase!=='play')return;
  state.phase='pause';
  $('pauseOv').style.display='flex';
}
$('pauseBtn').onclick=()=>pauseGame();
$('resumeBtn').onclick=()=>{
  state.phase='play';
  $('pauseOv').style.display='none';
  lastT=performance.now();
};
$('restartBtn').onclick=()=>{disposeScene();startGame();};
$('quitBtn').onclick=()=>{disposeScene();toMenu();};
$('againBtn').onclick=()=>{disposeScene();startGame();};
$('menuBtn').onclick=()=>{disposeScene();toMenu();};
$('start').onclick=()=>startGame();
function toMenu(){
  state.phase='menu';
  $('hud').style.display='none';
  $('pauseOv').style.display='none';
  $('resultOv').style.display='none';
  $('menu').style.display='flex';
}
function disposeScene(){
  if(!scene)return;
  scene.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    if(o.material){
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());
    }
  });
  scene=null; drone=null; mirrorGroup=null; mirrorDroneNode=null;
  renderer.clear();
}

// ---------------- メインループ ----------------
let lastT=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  let dt=(now-lastT)/1000;
  lastT=now;
  if(dt>0.1)dt=0.1;
  if(state.phase!=='play'&&state.phase!=='result')return;
  if(state.phase==='play'){
    updateInput();
    stepPhysics(dt);
    checkRings();
    syncMirror();
    if(!state.finished){
      state.time+=dt;
      if(sel.mode==='ta'){
        state.taLeft-=dt;
        if(state.taLeft<=0)finishTA();
      }
    }
    stepCamera(dt);
    stepHud(dt);
  }
  if(scene&&camera)renderer.render(scene,camera);
}
loop();
</script>
