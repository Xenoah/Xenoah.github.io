<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Xenoah Blog cover</title>
  <desc id="desc">A lightweight geometric cover image for the Xenoah blog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f8c7a"/>
      <stop offset="0.58" stop-color="#2f69c8"/>
      <stop offset="1" stop-color="#c24a5a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
  <rect x="78" y="82" width="1044" height="511" rx="20" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.34)"/>
  <circle cx="930" cy="180" r="74" fill="rgba(255,255,255,.18)"/>
  <circle cx="1010" cy="248" r="32" fill="rgba(255,255,255,.24)"/>
  <path d="M100 508C212 404 313 396 424 482C531 565 640 554 768 426C879 314 964 306 1100 396" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="12" stroke-linecap="round"/>
  <text x="118" y="250" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="0">XENOAH JOURNAL</text>
  <text x="116" y="336" fill="#fff" font-family="Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="0">Blog Articles</text>
  <text x="122" y="394" fill="rgba(255,255,255,.82)" font-family="Arial, sans-serif" font-size="26" letter-spacing="0">HTML + images in one folder</text>
</svg>
