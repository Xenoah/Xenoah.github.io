name: Blog checks
on:
  pull_request:
    paths: ['blog/**', '_layouts/**', '_includes/blog_articles.html', '_config.yml', 'sitemap.xml', 'scripts/check_blog_article_assets.js', '.github/workflows/blog-checks.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: blog-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - name: Install test dependencies
        working-directory: blog
        run: npm ci
      - name: Validate articles and application state
        working-directory: blog
        run: |
          npm run check:articles
          npm test
      - name: Create metadata escaping fixtures
        run: node blog/scripts/make-ci-fixture.cjs
      - name: Build actual Jekyll output
        uses: actions/jekyll-build-pages@v1
        with:
          destination: ./_site
      - name: Install test browsers
        working-directory: blog
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test native editor and reader
        working-directory: blog
        run: npm run test:browser
      - name: Remove generated test fixtures from publication output
        run: node blog/scripts/clean-ci-fixtures.cjs
      - name: Upload tested site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-browser-report
          path: |
            blog/playwright-report/
            blog/test-results/
          retention-days: 7
