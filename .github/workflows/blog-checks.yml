name: Site and blog checks
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sync_note:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: blog-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight note mirror dependencies
        run: python -m pip install -r scripts/note-sync-requirements.txt
      - name: Test note mirror trust boundaries
        run: python -m unittest discover -s scripts/tests -p 'test_note_sync.py'
      - name: Mirror published note articles only
        if: inputs.sync_note
        run: python scripts/sync-note.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - name: Install test dependencies
        working-directory: blog
        run: npm ci
      - name: Validate project catalog, generated files, local links and page metadata
        run: node scripts/check-site.js
      - name: Validate articles and application state
        working-directory: blog
        run: |
          npm run check:articles
          npm test
      - name: Create metadata escaping fixtures
        run: node blog/scripts/make-ci-fixture.cjs
      - name: Build actual Jekyll output
        uses: actions/jekyll-build-pages@v1
        with:
          destination: ./_site
      - name: Install test browsers
        working-directory: blog
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test native editor and reader
        working-directory: blog
        run: npm run test:browser
      - name: Remove generated test fixtures from publication output
        # Jekyll's Docker action creates the output directory as root.
        run: sudo node blog/scripts/clean-ci-fixtures.cjs
      - name: Upload tested site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-browser-report
          path: |
            blog/playwright-report/
            blog/test-results/
          retention-days: 7
